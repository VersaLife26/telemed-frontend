name: deploy

# Three Cloudflare Workers, one per surface.
#
# The surface is baked in at BUILD time -- scripts/select-surface.mjs writes
# app/globals.css from one of two Tailwind theme files, and CSS cannot branch
# at runtime -- so this is a matrix of three builds, not one build deployed
# three ways.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel: a cancelled run can leave one surface deployed and the other
  # two on the previous version, which is worse than a slow queue.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ matrix.surface }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Deploy the surfaces that build even if one fails: the alternative is a
      # patient app held back by an unrelated admin-console error.
      fail-fast: false
      matrix:
        surface: [patient, doctor, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same gates as ci.yml, per surface, because a build that typechecks
      # for `patient` can still fail for `admin`: they share one source tree
      # and differ in which routes lib/surface-routes.ts admits.
      - run: npm run typecheck
        env:
          TELEMED_SURFACE: ${{ matrix.surface }}

      - name: deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Baked into the bundle at build time. NEXT_PUBLIC_ because the
          # signalling websocket is opened by the BROWSER against the backend
          # directly -- a Next route handler cannot proxy an upgrade.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          # Off in every deployed surface. The backend's own TELEMED_TEST_MODE
          # is what actually removes the endpoints; this only hides the page,
          # and a page that links to endpoints that 404 is worse than no page.
          NEXT_PUBLIC_TELEMED_TEST_MODE: "false"
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # AUTH_SECRET is gone with NextAuth: Cloudflare Access authenticates
          # the admin console, so there is no session cookie to sign.
          # ADMIN_SESSION_MAX_AGE now drives the console's client-side idle
          # timer only -- the Access application's session duration is the
          # server-side bound.
          ADMIN_SESSION_MAX_AGE: ${{ vars.ADMIN_SESSION_MAX_AGE }}
        run: npm run deploy:${{ matrix.surface }}
