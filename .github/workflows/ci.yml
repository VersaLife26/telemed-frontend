name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Each surface's suite runs with that surface set: the consumer modules
      # derive cookie names and the required role from TELEMED_SURFACE.
      - run: npm run test:patient
      - run: npm run test:doctor
      - run: npm run test:admin

  build:
    name: build (${{ matrix.surface }})
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        surface: [patient, doctor, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          TELEMED_SURFACE: ${{ matrix.surface }}

  image:
    name: image (${{ matrix.surface }}-web)
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        surface: [patient, doctor, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR image tags
        id: meta
        run: |
          base="ghcr.io/versalife26/telemed/${{ matrix.surface }}-web"
          echo "tags=${base}:${GITHUB_SHA},${base}:0.3.0" >> "$GITHUB_OUTPUT"
      - name: log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            TELEMED_SURFACE=${{ matrix.surface }}
          cache-from: type=gha,scope=${{ matrix.surface }}
          cache-to: type=gha,mode=max,scope=${{ matrix.surface }}
