name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Each surface's suite runs with that surface set: the consumer modules
      # derive cookie names and the required role from TELEMED_SURFACE.
      - run: npm run test:patient
      - run: npm run test:doctor
      - run: npm run test:admin

  build:
    name: build (${{ matrix.surface }})
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        surface: [patient, doctor, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          TELEMED_SURFACE: ${{ matrix.surface }}
          NEXT_PUBLIC_TELEMED_SURFACE: ${{ matrix.surface }}
